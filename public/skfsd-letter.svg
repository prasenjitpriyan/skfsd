<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="circleGrad">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Glow Circle -->
  <circle cx="100" cy="100" r="90" fill="url(#circleGrad)" opacity="0.2"/>

  <!-- Main Circle -->
  <circle cx="100" cy="100" r="85" fill="url(#circleGrad)" stroke="#1e1b4b" stroke-width="3"/>

  <!-- Rotating Ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="white" stroke-width="1.5" opacity="0.3" stroke-dasharray="10,5"/>

  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="65" fill="rgba(255,255,255,0.1)"/>

  <!-- Letter Stack -->
  <g font-family="'Arial Black', sans-serif" font-weight="900" fill="white" text-anchor="middle">
    <!-- S -->
    <text x="100" y="70" font-size="22" opacity="0.95">S</text>

    <!-- K -->
    <text x="70" y="95" font-size="20" opacity="0.9">K</text>

    <!-- F (Highlighted) -->
    <text x="100" y="110" font-size="36" fill="#fbbf24" filter="url(#glow)">F</text>

    <!-- S -->
    <text x="130" y="95" font-size="20" opacity="0.9">S</text>

    <!-- D -->
    <text x="100" y="145" font-size="22" opacity="0.95">D</text>
  </g>

  <!-- Connecting Lines -->
  <line x1="100" y1="75" x2="100" y2="85" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="100" x2="90" y2="105" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="120" y1="100" x2="110" y2="105" stroke="white" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="120" x2="100" y2="130" stroke="white" stroke-width="1" opacity="0.3"/>

  <!-- Outer Decorative Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="#4338ca" stroke-width="0.5" opacity="0.5"/>
</svg>
