<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="minimalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="white"/>

  <!-- Hexagon Shape -->
  <path d="M 100 20 L 170 60 L 170 140 L 100 180 L 30 140 L 30 60 Z"
        fill="url(#minimalGrad)"
        stroke="#312e81"
        stroke-width="3"/>

  <!-- Inner Hexagon -->
  <path d="M 100 35 L 155 65 L 155 135 L 100 165 L 45 135 L 45 65 Z"
        fill="none"
        stroke="white"
        stroke-width="2"
        opacity="0.3"/>

  <!-- S -->
  <text x="100" y="70"
        font-family="'Arial Black', sans-serif"
        font-size="24"
        font-weight="900"
        fill="white"
        text-anchor="middle">S</text>

  <!-- K-F-S -->
  <text x="100" y="105"
        font-family="'Arial Black', sans-serif"
        font-size="28"
        font-weight="900"
        fill="#fbbf24"
        text-anchor="middle"
        letter-spacing="2">KFS</text>

  <!-- D -->
  <text x="100" y="140"
        font-family="'Arial Black', sans-serif"
        font-size="24"
        font-weight="900"
        fill="white"
        text-anchor="middle">D</text>

  <!-- Decorative Dots -->
  <circle cx="100" cy="80" r="2" fill="white" opacity="0.5"/>
  <circle cx="100" cy="115" r="2" fill="white" opacity="0.5"/>
</svg>
