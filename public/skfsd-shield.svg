<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#312e81;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Shield Shape -->
  <path d="M 100 20
           C 100 20, 160 40, 160 40
           L 160 110
           C 160 150, 100 180, 100 180
           C 100 180, 40 150, 40 110
           L 40 40
           C 40 40, 100 20, 100 20 Z"
        fill="url(#shieldGrad)"
        stroke="#1e1b4b"
        stroke-width="3"/>

  <!-- Inner Shield Detail -->
  <path d="M 100 35
           C 100 35, 150 50, 150 50
           L 150 105
           C 150 135, 100 160, 100 160
           C 100 160, 50 135, 50 105
           L 50 50
           C 50 50, 100 35, 100 35 Z"
        fill="none"
        stroke="white"
        stroke-width="2"
        opacity="0.2"/>

  <!-- Top Ribbon -->
  <path d="M 30 65 L 170 65 L 165 80 L 35 80 Z" fill="url(#ribbonGrad)"/>

  <!-- SKFSD Text -->
  <text x="100" y="75"
        font-family="'Arial Black', sans-serif"
        font-size="16"
        font-weight="900"
        fill="#312e81"
        text-anchor="middle">SKFSD</text>

  <!-- Large F in Center -->
  <text x="100" y="125"
        font-family="'Georgia', serif"
        font-size="55"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        opacity="0.9">F</text>

  <!-- Decorative Elements -->
  <circle cx="100" cy="115" r="45" fill="none" stroke="white" stroke-width="2" opacity="0.2"/>

  <!-- Stars -->
  <polygon points="100,45 102,51 108,51 103,55 105,61 100,57 95,61 97,55 92,51 98,51" fill="#fbbf24"/>

  <!-- Bottom Text -->
  <text x="100" y="195"
        font-family="Arial, sans-serif"
        font-size="9"
        fill="#4338ca"
        text-anchor="middle"
        font-weight="bold">FIRST SUB DIVISION</text>
</svg>
