<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="postGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>

    <linearGradient id="envelopeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="20" fill="url(#postGradient)"/>

  <!-- Envelope Base -->
  <path d="M 40 80 L 160 80 L 160 140 L 40 140 Z" fill="white" opacity="0.95"/>

  <!-- Envelope Flap -->
  <path d="M 40 80 L 100 115 L 160 80" fill="url(#envelopeGradient)" stroke="#d97706" stroke-width="2"/>
  <path d="M 40 80 L 100 115 L 160 80" fill="none" stroke="white" stroke-width="1" opacity="0.5"/>

  <!-- SKFSD Text -->
  <text x="100" y="105" font-family="'Courier New', monospace" font-size="18" font-weight="bold" fill="#312e81" text-anchor="middle">SKFSD</text>

  <!-- Decorative Lines (Address Lines) -->
  <line x1="50" y1="120" x2="150" y2="120" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="50" y1="128" x2="130" y2="128" stroke="#cbd5e1" stroke-width="2"/>

  <!-- Stamp Design (Top Right) -->
  <rect x="130" y="45" width="30" height="25" fill="white" stroke="#4338ca" stroke-width="2" rx="2"/>
  <circle cx="145" cy="57.5" r="6" fill="#4338ca" opacity="0.3"/>
  <text x="145" y="61" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#4338ca" text-anchor="middle">SK</text>

  <!-- Title -->
  <text x="100" y="30" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle" opacity="0.9">SOUTH KOLKATA</text>

  <!-- Subtitle -->
  <text x="100" y="175" font-family="Arial, sans-serif" font-size="10" fill="white" text-anchor="middle" opacity="0.7">First Sub Division</text>
</svg>
