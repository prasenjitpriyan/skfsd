<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#gradient1)" stroke="#312e81" stroke-width="3"/>

  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4338ca;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>

    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Inner Circle -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="white" stroke-width="2" opacity="0.3"/>

  <!-- Letter S (Top) -->
  <text x="100" y="60" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">S</text>

  <!-- Letter K -->
  <text x="70" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">K</text>

  <!-- Letter F (Center) -->
  <text x="100" y="110" font-family="Arial, sans-serif" font-size="38" font-weight="bold" fill="#fbbf24" text-anchor="middle">F</text>

  <!-- Letter S (Right) -->
  <text x="130" y="95" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">S</text>

  <!-- Letter D (Bottom) -->
  <text x="100" y="150" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">D</text>

  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="white" stroke-width="1" opacity="0.2" stroke-dasharray="5,5"/>

  <!-- Small Stars -->
  <circle cx="50" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="150" cy="50" r="2" fill="white" opacity="0.8"/>
  <circle cx="50" cy="150" r="2" fill="white" opacity="0.8"/>
  <circle cx="150" cy="150" r="2" fill="white" opacity="0.8"/>
</svg>
